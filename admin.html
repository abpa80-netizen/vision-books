<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION BOOKS — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F172A;--card:#1E293B;--card-2:#25324A;--line:rgba(148,163,184,.16);--text:#fff;--muted:#94A3B8;--green:#25D366;--blue:#3B82F6;--gold:#F59E0B;--red:#F43F5E;--display:'Plus Jakarta Sans',sans-serif;--body:'Inter',sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--body);padding-bottom:60px}button,input,select,textarea{font:14px var(--body)}.container{max-width:900px;margin:auto;padding:0 16px}h1,h2,h3{font-family:var(--display)}#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}#gate input,#gate button{width:260px;padding:14px 16px;border-radius:12px}.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text)}#gate input{background:var(--card);border:1px solid var(--line);color:var(--text)}#gate button,.btn-primary{background:var(--green);color:#052e1a;border:0;font-weight:700}#app{display:none}header{padding:18px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}header h1{font-size:19px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex-shrink:0;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;white-space:nowrap}.tab.active{background:var(--green);color:#052e1a;border-color:var(--green)}.panel{display:none;padding:16px 0 40px}.panel.active{display:block}.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat-card,.row-item{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat-card{padding:14px;text-align:center}.num{font:800 22px var(--display);color:var(--green)}.lbl{font-size:11px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}.btn{padding:10px 16px;border-radius:10px;border:0;font-weight:700;cursor:pointer}.btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--line)}.btn-danger{background:var(--red);color:#fff}.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}.list{display:flex;flex-direction:column;gap:8px}.row-item{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.info{flex:1;min-width:0}.info .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-actions{display:flex;gap:6px;flex-shrink:0}.form-overlay{position:fixed;inset:0;background:#030712cc;display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:20px 0}.form-overlay.show{display:flex}.form-box{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:520px;width:92%;padding:20px;margin:10px 0}.form-box h3{margin-bottom:16px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field textarea{min-height:70px;resize:vertical}.field input[type=color]{padding:4px;height:42px}.img-preview{width:70px;height:70px;border-radius:10px;object-fit:cover;margin-bottom:8px}.form-actions{display:flex;gap:10px;margin-top:16px}.form-actions .btn{flex:1}.msg{font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:12px}.msg.ok{background:#25d36626;color:var(--green)}.msg.err{background:#f43f5e26;color:var(--red)}table{width:100%;border-collapse:collapse;font-size:12.5px}th{text-align:left;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line)}.status-pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}.status-attente{background:#f59e0b2e;color:var(--gold)}.status-paye{background:#25d3662e;color:var(--green)}.loading{color:var(--muted);text-align:center;padding:30px;font-size:13px}
</style>
</head>
<body>
<div id="gate"><h2>🔒 VISION BOOKS — Admin</h2><input type="password" id="gatePass" placeholder="Mot de passe admin"><button id="gateBtn">Accéder</button><p id="gateMsg" style="color:var(--red);font-size:13px"></p></div>
<div id="app"><header><div class="container"><h1>VISION BOOKS — Panneau d'administration</h1></div></header><div class="container"><div class="tabs" id="tabs"></div><div id="panels"></div></div></div>
<div class="form-overlay" id="formOverlay"><div class="form-box"><h3 id="formTitle">Modifier</h3><div id="formMsg"></div><div id="formFields"></div><div class="form-actions"><button class="btn btn-secondary" id="formCancel">Annuler</button><button class="btn btn-primary" id="formSave">Enregistrer</button></div></div></div>
<script>
const GOOGLE_SHEET_API_URL="https://script.google.com/macros/s/AKfycbw1LW-oBF0O9559S2if6rSgrG9UlAxDm0ixYJrkS97tBEa2l5W7n0TeCRLlkIYy2zxt9g/exec";
const ENTITIES={produits:{label:"Produits",sheet:"Produits",titleField:"titre",subField:"categorie",fields:[['id','ID (unique)'],['titre','Titre'],['auteur','Auteur'],['categorie','Catégorie'],['prixRegulier','Prix régulier (MAD)','number'],['prixPromo','Prix promo (MAD)','number'],['format','Format'],['image','Image','image'],['description','Description','textarea'],['resumeKeyPoints','Points clés (séparés par |)','textarea'],['badge','Badge'],['lienTelechargement','Lien de téléchargement (Drive)']]},categories:{label:"Catégories",sheet:"Categories",titleField:"label",subField:"value",fields:[['id','ID (unique)'],['label','Nom affiché'],['emoji','Emoji'],['color','Couleur','color'],['type','Type','select',['categorie','badge']],['value','Valeur']]},leadMagnets:{label:"Lead Magnets",sheet:"LeadMagnets",titleField:"titre",subField:"format",fields:[['id','ID (unique)'],['titre','Titre'],['format','Format'],['image','Image','image'],['description','Description','textarea'],['lienTelechargement','Lien de téléchargement','text']]},blog:{label:"Blog",sheet:"Blog",titleField:"titre",subField:"date",fields:[['id','ID'],['titre','Titre'],['extrait','Extrait','textarea'],['contenu','Contenu','textarea'],['date','Date']]},avis:{label:"Avis clients",sheet:"Avis",titleField:"nom",subField:"texte",fields:[['nom','Nom'],['initiale','Initiale'],['note','Note','number'],['texte','Texte','textarea']]},faq:{label:"FAQ",sheet:"FAQ",titleField:"question",subField:"reponse",fields:[['question','Question'],['reponse','Réponse','textarea']]},modesPaiement:{label:"Paiement",sheet:"ModesPaiement",titleField:"label",subField:"numero",fields:[['key','Clé'],['label','Label affiché'],['qr','QR Code','image'],['beneficiaire','Bénéficiaire'],['numero','Numéro / RIB'],['typeChamp','Type de champ']]}};
const KEYVALUE_ENTITIES={config:{label:"Textes & Couleurs",sheet:"Config",fields:[['heroTitre','Titre principal','textarea'],['heroSousTitre','Sous-titre','textarea'],['bandeauTexte','Texte du bandeau'],['cadeauxTitre','Titre bannière cadeaux'],['cadeauxSousTitre','Sous-titre cadeaux','textarea'],['couleurPrincipale','Couleur principale','color'],['couleurAccent','Couleur accent','color'],['couleurDoree','Couleur dorée','color'],['police','Police'],['vipTitre','Titre Pack VIP'],['vipSousTitre','Sous-titre Pack VIP','textarea'],['vipPrixRegulier','Prix régulier VIP','number'],['vipPrixPromo','Prix promo VIP','number']]},fondateur:{label:"Fondateur",sheet:"ContenuFondateur",fields:[['photo','Photo','image'],['initiale','Initiales'],['titre','Titre'],['histoire','Histoire','textarea'],['lienGroupeWhatsapp','Lien WhatsApp'] ]}};
const fieldObj=f=>({key:f[0],label:f[1],type:f[2],options:f[3]});let ADMIN_PASSWORD='',currentEntity=null,currentEditRow=null;
const apiGetRaw=async s=>(await fetch(`${GOOGLE_SHEET_API_URL}?action=raw&sheet=${encodeURIComponent(s)}&_t=${Date.now()}`,{cache:'no-store'})).json();const apiGetAnalytics=async()=>(await fetch(`${GOOGLE_SHEET_API_URL}?action=analytics&_t=${Date.now()}`,{cache:'no-store'})).json();const apiPost=async p=>(await fetch(GOOGLE_SHEET_API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({password:ADMIN_PASSWORD,...p})})).json();
function initApp(){const tabs=document.getElementById('tabs'),panels=document.getElementById('panels');tabs.innerHTML='';panels.innerHTML='';const list=[{id:'dashboard',label:'📊 Dashboard'},...Object.keys(ENTITIES).map(k=>({id:k,label:ENTITIES[k].label})),...Object.keys(KEYVALUE_ENTITIES).map(k=>({id:k,label:KEYVALUE_ENTITIES[k].label})),{id:'leads',label:'📇 Prospects'},{id:'commandes',label:'🛒 Commandes'}];list.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(!i?' active':'');b.textContent=t.label;b.dataset.tab=t.id;b.onclick=()=>showTab(t.id);tabs.appendChild(b);const p=document.createElement('section');p.className='panel'+(!i?' active':'');p.id='panel-'+t.id;p.innerHTML='<p class="loading">Chargement...</p>';panels.appendChild(p)});showTab('dashboard')}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+id));if(id==='dashboard')return loadDashboard();if(id==='leads')return loadLeads();if(id==='commandes')return loadCommandes();if(ENTITIES[id])return loadEntityList(id);if(KEYVALUE_ENTITIES[id])return loadKeyValuePanel(id)}
async function loadDashboard(){const p=document.getElementById('panel-dashboard');p.innerHTML='<p class="loading">Chargement...</p>';try{const s=await apiGetAnalytics();p.innerHTML=`<div class="stat-row"><div class="stat-card"><div class="num">${s.totalViews||0}</div><div class="lbl">Visites</div></div><div class="stat-card"><div class="num">${s.totalClicks||0}</div><div class="lbl">Clics commande</div></div><div class="stat-card"><div class="num">${s.conversionRate||0}%</div><div class="lbl">Taux de conversion</div></div></div><h3 style="margin-bottom:10px;font-size:15px">Activité récente</h3><div class="list" id="recentActivity"></div>`;const l=document.getElementById('recentActivity');if(!s.recent?.length)l.innerHTML='<p class="loading">Aucune activité pour le moment.</p>';else s.recent.forEach(r=>{const e=document.createElement('div');e.className='row-item';e.innerHTML=`<div class="info"><div class="t">${esc(r.type||'')}</div><div class="s">${esc(r.label||'')} · ${esc(String(r.date||'')).slice(0,19)}</div></div>`;l.appendChild(e)})}catch(e){p.innerHTML=`<p class="loading">Erreur : ${esc(e.message||e)}<br><br>Vérifiez que l'onglet Analytics existe.</p>`}}
async function loadEntityList(k){const n=ENTITIES[k],p=document.getElementById('panel-'+k);p.innerHTML='<p class="loading">Chargement...</p>';try{const rows=await apiGetRaw(n.sheet);p.innerHTML=`<div class="toolbar"><span style="color:var(--muted);font-size:12.5px">${rows.length} élément(s)</span><button class="btn btn-primary btn-sm" id="add-${k}">+ Ajouter</button></div><div class="list" id="list-${k}"></div>`;document.getElementById('add-'+k).onclick=()=>openForm(k);const l=document.getElementById('list-'+k);if(!rows.length){l.innerHTML='<p class="loading">Aucun élément.</p>';return}rows.forEach(r=>{const e=document.createElement('div');e.className='row-item';e.innerHTML=`<div class="info"><div class="t">${esc(r[n.titleField]||'(sans titre)')}</div><div class="s">${esc(r[n.subField]||'')}</div></div><div class="row-actions"><button class="btn btn-secondary btn-sm" data-e>✏️</button><button class="btn btn-danger btn-sm" data-d>🗑️</button></div>`;e.querySelector('[data-e]').onclick=()=>openForm(k,r);e.querySelector('[data-d]').onclick=()=>deleteRow(k,r);l.appendChild(e)})}catch(e){p.innerHTML=`<p class="loading">Erreur sur "${n.sheet}" : ${esc(e.message||e)}</p>`}}
function openForm(k,row=null){const n=ENTITIES[k];currentEntity=k;currentEditRow=row;document.getElementById('formTitle').textContent=row?'Modifier':'Ajouter — '+n.label;document.getElementById('formMsg').innerHTML='';const w=document.getElementById('formFields');w.innerHTML='';n.fields.map(fieldObj).forEach(f=>{const v=row?.[f.key]??'',d=document.createElement('div');d.className='field';if(f.type==='image')d.innerHTML=`<label>${f.label}</label>${v?`<img src="${v}" class="img-preview" id="preview-${f.key}">`:''}<input type="file" accept="image/*" id="file-${f.key}"><input type="hidden" id="field-${f.key}" value="${attr(v)}"><p id="status-${f.key}" style="font-size:11px;color:var(--muted)"></p>`;else if(f.type==='textarea')d.innerHTML=`<label>${f.label}</label><textarea id="field-${f.key}">${esc(v)}</textarea>`;else if(f.type==='select')d.innerHTML=`<label>${f.label}</label><select id="field-${f.key}">${f.options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;else if(f.type==='color')d.innerHTML=`<label>${f.label}</label><input type="color" id="field-${f.key}" value="${v||'#25D366'}">`;else d.innerHTML=`<label>${f.label}</label><input type="${f.type==='number'?'number':'text'}" id="field-${f.key}" value="${attr(v)}">`;w.appendChild(d);if(f.type==='image')document.getElementById('file-'+f.key).onchange=e=>upload(e,f.key)});document.getElementById('formOverlay').classList.add('show')}
async function upload(e,k){const file=e.target.files[0];if(!file)return;const s=document.getElementById('status-'+k);s.textContent='Téléversement en cours...';const reader=new FileReader();reader.onload=async()=>{try{const r=await apiPost({action:'uploadImage',base64:reader.result.split(',')[1],filename:file.name,mimeType:file.type});if(r.ok){document.getElementById('field-'+k).value=r.url;s.textContent='✅ Image téléversée';let im=document.getElementById('preview-'+k);if(!im){im=document.createElement('img');im.className='img-preview';im.id='preview-'+k;e.target.parentElement.insertBefore(im,e.target)}im.src=r.url}else s.textContent='❌ Échec : '+(r.error||'')}catch(x){s.textContent='❌ Échec du téléversement'}};reader.readAsDataURL(file)}
document.getElementById('formCancel').onclick=()=>document.getElementById('formOverlay').classList.remove('show');document.getElementById('formSave').onclick=async()=>{const n=ENTITIES[currentEntity],data={};n.fields.forEach(f=>{const e=document.getElementById('field-'+f[0]);data[f[0]]=e?.value||''});if(currentEditRow?.__row)data.__row=currentEditRow.__row;const m=document.getElementById('formMsg');m.innerHTML='<div class="msg ok">Enregistrement...</div>';try{const r=await apiPost({action:'saveRow',sheet:n.sheet,data});if(r.ok){document.getElementById('formOverlay').classList.remove('show');loadEntityList(currentEntity)}else m.innerHTML=`<div class="msg err">Erreur : ${esc(r.error||'')}</div>`}catch(e){m.innerHTML='<div class="msg err">Erreur réseau</div>'}};async function deleteRow(k,r){if(!confirm('Supprimer cet élément définitivement ?'))return;const x=await apiPost({action:'deleteRow',sheet:ENTITIES[k].sheet,row:r.__row});if(x.ok)loadEntityList(k);else alert('Erreur : '+(x.error||''))}
async function loadKeyValuePanel(k){const n=KEYVALUE_ENTITIES[k],p=document.getElementById('panel-'+k);p.innerHTML='<p class="loading">Chargement...</p>';try{const rows=await apiGetRaw(n.sheet),cur={};rows.forEach(r=>cur[r.champ]=r.valeur);p.innerHTML=`<div id="kv-${k}"></div><button class="btn btn-primary" id="save-${k}" style="margin-top:14px;width:100%">Enregistrer les modifications</button><div id="msg-${k}"></div>`;const w=document.getElementById('kv-'+k);n.fields.map(fieldObj).forEach(f=>{const v=cur[f.key]??'',d=document.createElement('div');d.className='field';if(f.type==='textarea')d.innerHTML=`<label>${f.label}</label><textarea id="kvf-${k}-${f.key}">${esc(v)}</textarea>`;else if(f.type==='color')d.innerHTML=`<label>${f.label}</label><input type="color" id="kvf-${k}-${f.key}" value="${v||'#25D366'}">`;else d.innerHTML=`<label>${f.label}</label><input type="${f.type==='number'?'number':'text'}" id="kvf-${k}-${f.key}" value="${attr(v)}">`;w.appendChild(d)});document.getElementById('save-'+k).onclick=async()=>{const m=document.getElementById('msg-'+k);m.innerHTML='<div class="msg ok">Enregistrement...</div>';try{for(const f of n.fields)await apiPost({action:'saveKeyValue',sheet:n.sheet,champ:f[0],valeur:document.getElementById(`kvf-${k}-${f[0]}`).value});m.innerHTML='<div class="msg ok">✅ Enregistré</div>'}catch(e){m.innerHTML='<div class="msg err">Erreur réseau</div>'}}}catch(e){p.innerHTML=`<p class="loading">Erreur sur "${n.sheet}" : ${esc(e.message||e)}</p>`}}
async function loadLeads(){const p=document.getElementById('panel-leads');p.innerHTML='<p class="loading">Chargement...</p>';try{const rows=await apiGetRaw('Leads');p.innerHTML=`<div class="toolbar"><span style="color:var(--muted)">${rows.length} prospect(s)</span><button class="btn btn-secondary btn-sm" id="exportLeads">Exporter CSV</button></div><div style="overflow-x:auto"><table><thead><tr><th>Prénom</th><th>WhatsApp</th><th>Livre</th><th>Date</th></tr></thead><tbody id="leadsBody"></tbody></table></div>`;const b=document.getElementById('leadsBody');rows.slice().reverse().forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(r.prenom||'')}</td><td>${esc(r.numero||'')}</td><td>${esc(r.livre||'')}</td><td>${esc(String(r.date||'')).slice(0,10)}</td>`;b.appendChild(tr)});document.getElementById('exportLeads').onclick=()=>exportCsv(rows,['prenom','numero','livre','date'],'leads.csv')}catch(e){p.innerHTML=`<p class="loading">Erreur : ${esc(e.message||e)}</p>`}}
async function loadCommandes(){const p=document.getElementById('panel-commandes');p.innerHTML='<p class="loading">Chargement...</p>';try{const [rows,products]=await Promise.all([apiGetRaw('Commandes'),apiGetRaw('Produits')]);p.innerHTML=`<div class="toolbar"><span style="color:var(--muted)">${rows.length} commande(s)</span><button class="btn btn-secondary btn-sm" id="exportOrders">Exporter CSV</button></div><div class="list" id="orders"></div>`;const l=document.getElementById('orders');rows.slice().reverse().forEach(r=>{const pr=products.find(x=>x.titre===r.produit),link=pr?.lienTelechargement||'',paid=['payé','paye'].includes(String(r.statut).toLowerCase()),e=document.createElement('div');e.className='row-item';e.innerHTML=`<div class="info"><div class="t">${esc(r.produit||'')} — ${esc(String(r.prix||''))} MAD</div><div class="s">${esc(String(r.date||'')).slice(0,19)} · <span class="status-pill ${paid?'status-paye':'status-attente'}">${esc(r.statut||'en attente')}</span></div></div><div class="row-actions">${link?`<button class="btn btn-secondary btn-sm" data-copy="${attr(link)}">Copier le lien</button>`:''}${!paid?'<button class="btn btn-primary btn-sm" data-paid>Marquer payé</button>':''}</div>`;e.querySelector('[data-copy]')?.addEventListener('click',()=>{navigator.clipboard.writeText(link);e.querySelector('[data-copy]').textContent='Copié !'});e.querySelector('[data-paid]')?.addEventListener('click',async()=>{await apiPost({action:'updateOrderStatus',row:r.__row,statut:'Payé'});loadCommandes()});l.appendChild(e)});document.getElementById('exportOrders').onclick=()=>exportCsv(rows,['produit','prix','statut','date'],'commandes.csv')}catch(e){p.innerHTML=`<p class="loading">Erreur : ${esc(e.message||e)}</p>`}}
function exportCsv(rows,cols,name){const csv=cols.join(',')+'\n'+rows.map(r=>cols.map(c=>'"'+String(r[c]||'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click()}function esc(v){const d=document.createElement('div');d.textContent=v==null?'':v;return d.innerHTML}function attr(v){return String(v==null?'':v).replace(/"/g,'&quot;')}
document.getElementById('gateBtn').onclick=login;document.getElementById('gatePass').onkeydown=e=>{if(e.key==='Enter')login()};function login(){const p=document.getElementById('gatePass').value;if(!p)return;ADMIN_PASSWORD=p;sessionStorage.setItem('vb_admin_pass',p);document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';initApp()}const saved=sessionStorage.getItem('vb_admin_pass');if(saved){ADMIN_PASSWORD=saved;document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';initApp()}
</script>
</body>
</html>
