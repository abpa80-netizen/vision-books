<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION BOOKS — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A;--card:#1E293B;--card-2:#25324A;--line:rgba(148,163,184,.16);
  --text:#FFFFFF;--muted:#94A3B8;--green:#25D366;--blue:#3B82F6;--gold:#F59E0B;--red:#F43F5E;
  --font-display:'Plus Jakarta Sans',sans-serif;--font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding-bottom:60px}
button,input,select,textarea{font-family:inherit;font-size:14px}
.container{max-width:900px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--font-display)}
a{color:var(--blue)}

/* GATE */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
#gate input{padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);width:260px}
#gate button{padding:14px 20px;border-radius:12px;background:var(--green);color:#052e1a;font-weight:700;border:none;width:260px}

/* LAYOUT */
#app{display:none}
header{padding:18px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
header h1{font-size:19px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;white-space:nowrap}
.tab.active{background:var(--green);color:#052e1a;border-color:var(--green)}
section.panel{display:none;padding:16px 0 40px}
section.panel.active{display:block}

/* CARDS / STATS */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat-card .num{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--green)}
.stat-card .lbl{font-size:11px;color:var(--muted);margin-top:2px}

/* LIST + FORM */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.btn-primary{background:var(--green);color:#052e1a}
.btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--line)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.list{display:flex;flex-direction:column;gap:8px}
.row-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-item .info{flex:1;min-width:0}
.row-item .info .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .info .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:6px;flex-shrink:0}

.form-overlay{position:fixed;inset:0;background:rgba(3,7,18,.8);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:20px 0}
.form-overlay.show{display:flex}
.form-box{background:var(--bg);border:1px solid var(--line);border-radius:16px;max-width:520px;width:92%;padding:20px;margin:10px 0}
.form-box h3{margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text)}
.field textarea{min-height:70px;resize:vertical}
.field input[type=color]{padding:4px;height:42px}
.field .img-preview{width:70px;height:70px;border-radius:10px;object-fit:cover;margin-bottom:8px;background:var(--card-2)}
.form-actions{display:flex;gap:10px;margin-top:16px}
.form-actions .btn{flex:1}
.msg{font-size:12.5px;padding:9px 12px;border-radius:9px;margin-bottom:12px}
.msg.ok{background:rgba(37,211,102,.15);color:var(--green)}
.msg.err{background:rgba(244,63,94,.15);color:var(--red)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line)}
.status-pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.status-attente{background:rgba(245,158,11,.18);color:var(--gold)}
.status-paye{background:rgba(37,211,102,.18);color:var(--green)}
.loading{color:var(--muted);text-align:center;padding:30px;font-size:13px}
</style>
</head>
<body>

<!-- ============ PASSWORD GATE ============ -->
<div id="gate">
  <h2>🔒 VISION BOOKS — Admin</h2>
  <input type="password" id="gatePass" placeholder="Mot de passe admin">
  <button id="gateBtn">Accéder</button>
  <p id="gateMsg" style="color:var(--red);font-size:13px"></p>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="container">
      <h1>VISION BOOKS — Panneau d'administration</h1>
    </div>
  </header>
  <div class="container">
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>
</div>

<!-- ============ FORM OVERLAY (réutilisé pour tous les onglets) ============ -->
<div class="form-overlay" id="formOverlay">
  <div class="form-box">
    <h3 id="formTitle">Modifier</h3>
    <div id="formMsg"></div>
    <div id="formFields"></div>
    <div class="form-actions">
      <button class="btn btn-secondary" id="formCancel">Annuler</button>
      <button class="btn btn-primary" id="formSave">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwg0n4NKWKcqEHc2mYmrnWS_tbLEtrkUelXHEEH4j46qR72G2c_2YVV9dJUq7whotTEsw/exec";

/* =====================================================================
   SCHÉMA — décrit chaque onglet éditable : ses champs et leur type.
   Pour ajouter un onglet gérable depuis l'admin plus tard, il suffit
   d'ajouter une entrée ici (aucune autre modification nécessaire).
   ===================================================================== */
const ENTITIES = {
  produits: { label:"Produits", sheet:"Produits", titleField:"titre", subField:"categorie", fields:[
    {key:"id",label:"ID (unique)"}, {key:"titre",label:"Titre"}, {key:"auteur",label:"Auteur"},
    {key:"categorie",label:"Catégorie (doit correspondre à l'onglet Categories)"},
    {key:"prixRegulier",label:"Prix régulier (MAD)",type:"number"},
    {key:"prixPromo",label:"Prix promo (MAD, 0 = gratuit)",type:"number"},
    {key:"format",label:"Format (ex: Ebook, Livre Audio MP3)"},
    {key:"image",label:"Image",type:"image"},
    {key:"description",label:"Description",type:"textarea"},
    {key:"resumeKeyPoints",label:"Points clés (séparés par |)",type:"textarea"},
    {key:"badge",label:"Badge (mettre \"Best-Seller\" pour apparaître dans Best-Sellers)"},
    {key:"lienTelechargement",label:"Lien de téléchargement (Drive)"}
  ]},
  categories: { label:"Catégories", sheet:"Categories", titleField:"label", subField:"value", fields:[
    {key:"id",label:"ID (unique, sans espace)"}, {key:"label",label:"Nom affiché"},
    {key:"emoji",label:"Emoji"}, {key:"color",label:"Couleur",type:"color"},
    {key:"type",label:"Type",type:"select",options:["categorie","badge"]},
    {key:"value",label:"Valeur à faire correspondre"}
  ]},
  leadMagnets: { label:"Lead Magnets", sheet:"LeadMagnets", titleField:"titre", subField:"format", fields:[
    {key:"id",label:"ID (unique)"}, {key:"titre",label:"Titre"}, {key:"format",label:"Format"},
    {key:"image",label:"Image",type:"image"}, {key:"description",label:"Description",type:"textarea"},
    {key:"lienTelechargement",label:"Lien de téléchargement (Drive)"}
  ]},
  blog: { label:"Blog", sheet:"Blog", titleField:"titre", subField:"date", fields:[
    {key:"id",label:"ID (unique)"}, {key:"titre",label:"Titre"},
    {key:"extrait",label:"Extrait (accroche courte)",type:"textarea"},
    {key:"contenu",label:"Contenu complet",type:"textarea"}, {key:"date",label:"Date (AAAA-MM-JJ)"}
  ]},
  avis: { label:"Avis clients", sheet:"Avis", titleField:"nom", subField:"texte", fields:[
    {key:"nom",label:"Nom"}, {key:"initiale",label:"Initiale"},
    {key:"note",label:"Note (1 à 5)",type:"number"}, {key:"texte",label:"Texte de l'avis",type:"textarea"}
  ]},
  faq: { label:"FAQ", sheet:"FAQ", titleField:"question", subField:"reponse", fields:[
    {key:"question",label:"Question"}, {key:"reponse",label:"Réponse",type:"textarea"}
  ]},
  modesPaiement: { label:"Paiement", sheet:"ModesPaiement", titleField:"label", subField:"numero", fields:[
    {key:"key",label:"Clé (cih / cashplus / mobilemoney — ne pas changer)"},
    {key:"label",label:"Label affiché"}, {key:"qr",label:"QR Code",type:"image"},
    {key:"beneficiaire",label:"Bénéficiaire"}, {key:"numero",label:"Numéro / RIB"},
    {key:"typeChamp",label:"Type de champ (ex: RIB)"}
  ]}
};

const KEYVALUE_ENTITIES = {
  config: { label:"Textes & Couleurs", sheet:"Config", fields:[
    {key:"heroTitre",label:"Titre principal (hero)",type:"textarea"},
    {key:"heroSousTitre",label:"Sous-titre (hero)",type:"textarea"},
    {key:"bandeauTexte",label:"Texte du bandeau d'urgence"},
    {key:"cadeauxTitre",label:"Titre bannière cadeaux"},
    {key:"cadeauxSousTitre",label:"Sous-titre bannière cadeaux",type:"textarea"},
    {key:"couleurPrincipale",label:"Couleur principale",type:"color"},
    {key:"couleurAccent",label:"Couleur accent",type:"color"},
    {key:"couleurDoree",label:"Couleur dorée",type:"color"},
    {key:"police",label:"Police (nom Google Fonts, ex: Poppins)"},
    {key:"vipTitre",label:"Titre Pack VIP"},
    {key:"vipSousTitre",label:"Sous-titre Pack VIP",type:"textarea"},
    {key:"vipPrixRegulier",label:"Prix régulier VIP (nombre seul)",type:"number"},
    {key:"vipPrixPromo",label:"Prix promo VIP (nombre seul)",type:"number"}
  ]},
  fondateur: { label:"Fondateur", sheet:"ContenuFondateur", fields:[
    {key:"photo",label:"Photo",type:"image"},
    {key:"initiale",label:"Initiales (si pas de photo)"},
    {key:"titre",label:"Titre de la section"},
    {key:"histoire",label:"Histoire / storytelling",type:"textarea"},
    {key:"lienGroupeWhatsapp",label:"Lien du groupe WhatsApp"}
  ]}
};

let ADMIN_PASSWORD = "";
let currentEntity = null;
let currentEditRow = null; // objet de la ligne en cours d'édition (avec __row), ou null si ajout

/* =====================================================================
   AUTH
   ===================================================================== */
document.getElementById("gateBtn").addEventListener("click", tryLogin);
document.getElementById("gatePass").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });

function tryLogin(){
  const pass = document.getElementById("gatePass").value;
  if(!pass){ return; }
  ADMIN_PASSWORD = pass;
  sessionStorage.setItem("vb_admin_pass", pass);
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  initApp();
}
(function autoLogin(){
  const saved = sessionStorage.getItem("vb_admin_pass");
  if(saved){
    ADMIN_PASSWORD = saved;
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    initApp();
  }
})();

/* =====================================================================
   API HELPERS
   ===================================================================== */
async function apiGetRaw(sheetName){
  const url = `${GOOGLE_SHEET_API_URL}?action=raw&sheet=${encodeURIComponent(sheetName)}&_t=${Date.now()}`;
  const res = await fetch(url, { cache:"no-store" });
  return res.json();
}
async function apiGetAnalytics(){
  const url = `${GOOGLE_SHEET_API_URL}?action=analytics&_t=${Date.now()}`;
  const res = await fetch(url, { cache:"no-store" });
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(GOOGLE_SHEET_API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body: JSON.stringify(Object.assign({ password: ADMIN_PASSWORD }, payload))
  });
  return res.json();
}

/* =====================================================================
   APP INIT — construit les onglets et panneaux
   ===================================================================== */
function initApp(){
  const tabs = document.getElementById("tabs");
  const panels = document.getElementById("panels");
  tabs.innerHTML = "";
  panels.innerHTML = "";

  const tabList = [
    { id:"dashboard", label:"📊 Dashboard" },
    ...Object.keys(ENTITIES).map(k=>({ id:k, label:ENTITIES[k].label })),
    ...Object.keys(KEYVALUE_ENTITIES).map(k=>({ id:k, label:KEYVALUE_ENTITIES[k].label })),
    { id:"leads", label:"📇 Prospects" },
    { id:"commandes", label:"🛒 Commandes" }
  ];

  tabList.forEach((t,i)=>{
    const btn = document.createElement("button");
    btn.className = "tab" + (i===0 ? " active" : "");
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.addEventListener("click", ()=> showTab(t.id));
    tabs.appendChild(btn);

    const panel = document.createElement("section");
    panel.className = "panel" + (i===0 ? " active" : "");
    panel.id = "panel-" + t.id;
    panel.innerHTML = `<p class="loading">Chargement...</p>`;
    panels.appendChild(panel);
  });

  showTab("dashboard");
}

function showTab(id){
  document.querySelectorAll(".tab").forEach(t=> t.classList.toggle("active", t.dataset.tab===id));
  document.querySelectorAll(".panel").forEach(p=> p.classList.toggle("active", p.id==="panel-"+id));

  if(id === "dashboard") return loadDashboard();
  if(id === "leads") return loadLeads();
  if(id === "commandes") return loadCommandes();
  if(ENTITIES[id]) return loadEntityList(id);
  if(KEYVALUE_ENTITIES[id]) return loadKeyValuePanel(id);
}

/* =====================================================================
   DASHBOARD
   ===================================================================== */
async function loadDashboard(){
  const panel = document.getElementById("panel-dashboard");
  panel.innerHTML = `<p class="loading">Chargement...</p>`;
  try{
    const stats = await apiGetAnalytics();
    panel.innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="num">${stats.totalViews}</div><div class="lbl">Visites</div></div>
        <div class="stat-card"><div class="num">${stats.totalClicks}</div><div class="lbl">Clics commande</div></div>
        <div class="stat-card"><div class="num">${stats.conversionRate}%</div><div class="lbl">Taux de conversion</div></div>
      </div>
      <h3 style="margin-bottom:10px;font-size:15px">Activité récente</h3>
      <div class="list" id="recentActivity"></div>`;
    const list = document.getElementById("recentActivity");
    if(!stats.recent || stats.recent.length === 0){
      list.innerHTML = `<p class="loading">Aucune activité pour le moment.</p>`;
    }else{
      stats.recent.forEach(r=>{
        const el = document.createElement("div");
        el.className = "row-item";
        el.innerHTML = `<div class="info"><div class="t">${escapeHtml(r.type||"")}</div><div class="s">${escapeHtml(r.label||"")} · ${escapeHtml(String(r.date||"")).slice(0,19)}</div></div>`;
        list.appendChild(el);
      });
    }
  }catch(err){
    panel.innerHTML = `<p class="loading">Erreur de chargement. Vérifiez que l'onglet "Analytics" existe dans votre Sheet.</p>`;
  }
}

/* =====================================================================
   LISTES GÉNÉRIQUES (Produits, Categories, LeadMagnets, Blog, Avis, FAQ, ModesPaiement)
   ===================================================================== */
async function loadEntityList(entityKey){
  const entity = ENTITIES[entityKey];
  const panel = document.getElementById("panel-" + entityKey);
  panel.innerHTML = `<p class="loading">Chargement...</p>`;
  try{
    const rows = await apiGetRaw(entity.sheet);
    panel.innerHTML = `
      <div class="toolbar">
        <span style="color:var(--muted);font-size:12.5px">${rows.length} élément(s)</span>
        <button class="btn btn-primary btn-sm" id="addBtn-${entityKey}">+ Ajouter</button>
      </div>
      <div class="list" id="list-${entityKey}"></div>`;
    document.getElementById(`addBtn-${entityKey}`).addEventListener("click", ()=> openForm(entityKey, null));

    const list = document.getElementById(`list-${entityKey}`);
    if(rows.length === 0){
      list.innerHTML = `<p class="loading">Aucun élément. Cliquez sur "+ Ajouter".</p>`;
      return;
    }
    rows.forEach(row=>{
      const el = document.createElement("div");
      el.className = "row-item";
      const title = row[entity.titleField] || "(sans titre)";
      const sub = row[entity.subField] || "";
      el.innerHTML = `
        <div class="info"><div class="t">${escapeHtml(String(title))}</div><div class="s">${escapeHtml(String(sub))}</div></div>
        <div class="row-actions">
          <button class="btn btn-secondary btn-sm" data-edit>✏️</button>
          <button class="btn btn-danger btn-sm" data-del>🗑️</button>
        </div>`;
      el.querySelector("[data-edit]").addEventListener("click", ()=> openForm(entityKey, row));
      el.querySelector("[data-del]").addEventListener("click", ()=> confirmDelete(entityKey, row));
      list.appendChild(el);
    });
  }catch(err){
    panel.innerHTML = `<p class="loading">Erreur de chargement de l'onglet "${entity.sheet}".</p>`;
  }
}

function openForm(entityKey, row){
  const entity = ENTITIES[entityKey];
  currentEntity = entityKey;
  currentEditRow = row;
  document.getElementById("formTitle").textContent = row ? "Modifier" : "Ajouter — " + entity.label;
  document.getElementById("formMsg").innerHTML = "";
  const fieldsWrap = document.getElementById("formFields");
  fieldsWrap.innerHTML = "";

  entity.fields.forEach(f=>{
    const value = row ? (row[f.key] !== undefined ? row[f.key] : "") : "";
    const div = document.createElement("div");
    div.className = "field";
    if(f.type === "image"){
      div.innerHTML = `
        <label>${f.label}</label>
        ${value ? `<img src="${value}" class="img-preview" id="preview-${f.key}">` : ""}
        <input type="file" accept="image/*" id="file-${f.key}">
        <input type="hidden" id="field-${f.key}" value="${escapeAttr(value)}">
        <p style="font-size:11px;color:var(--muted);margin-top:4px" id="status-${f.key}"></p>`;
    }else if(f.type === "textarea"){
      div.innerHTML = `<label>${f.label}</label><textarea id="field-${f.key}">${escapeHtml(String(value))}</textarea>`;
    }else if(f.type === "select"){
      div.innerHTML = `<label>${f.label}</label><select id="field-${f.key}">${f.options.map(o=>`<option value="${o}" ${o===value?"selected":""}>${o}</option>`).join("")}</select>`;
    }else if(f.type === "color"){
      div.innerHTML = `<label>${f.label}</label><input type="color" id="field-${f.key}" value="${value || '#25D366'}">`;
    }else{
      div.innerHTML = `<label>${f.label}</label><input type="${f.type==='number'?'number':'text'}" id="field-${f.key}" value="${escapeAttr(String(value))}">`;
    }
    fieldsWrap.appendChild(div);

    if(f.type === "image"){
      document.getElementById(`file-${f.key}`).addEventListener("change", (e)=> handleImageUpload(e, f.key));
    }
  });

  document.getElementById("formOverlay").classList.add("show");
}

function handleImageUpload(e, fieldKey){
  const file = e.target.files[0];
  if(!file) return;
  const status = document.getElementById(`status-${fieldKey}`);
  status.textContent = "Téléversement en cours...";
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    try{
      const res = await apiPost({ action:"uploadImage", base64, filename:file.name, mimeType:file.type });
      if(res.ok){
        document.getElementById(`field-${fieldKey}`).value = res.url;
        status.textContent = "✅ Image téléversée";
        let preview = document.getElementById(`preview-${fieldKey}`);
        if(!preview){
          preview = document.createElement("img");
          preview.className = "img-preview";
          preview.id = `preview-${fieldKey}`;
          e.target.parentElement.insertBefore(preview, e.target);
        }
        preview.src = res.url;
      }else{
        status.textContent = "❌ Échec : " + (res.error || "");
      }
    }catch(err){
      status.textContent = "❌ Échec du téléversement";
    }
  };
  reader.readAsDataURL(file);
}

document.getElementById("formCancel").addEventListener("click", ()=>{
  document.getElementById("formOverlay").classList.remove("show");
});

document.getElementById("formSave").addEventListener("click", async ()=>{
  const entity = ENTITIES[currentEntity];
  const data = {};
  entity.fields.forEach(f=>{
    const el = document.getElementById(`field-${f.key}`);
    data[f.key] = el ? el.value : "";
  });
  if(currentEditRow && currentEditRow.__row) data.__row = currentEditRow.__row;

  const msg = document.getElementById("formMsg");
  msg.innerHTML = `<div class="msg ok">Enregistrement...</div>`;
  try{
    const res = await apiPost({ action:"saveRow", sheet:entity.sheet, data });
    if(res.ok){
      document.getElementById("formOverlay").classList.remove("show");
      loadEntityList(currentEntity);
    }else{
      msg.innerHTML = `<div class="msg err">Erreur : ${escapeHtml(res.error||"")}</div>`;
    }
  }catch(err){
    msg.innerHTML = `<div class="msg err">Erreur réseau</div>`;
  }
});

async function confirmDelete(entityKey, row){
  if(!confirm("Supprimer cet élément définitivement ?")) return;
  const entity = ENTITIES[entityKey];
  const res = await apiPost({ action:"deleteRow", sheet:entity.sheet, row: row.__row });
  if(res.ok) loadEntityList(entityKey);
  else alert("Erreur : " + (res.error||""));
}

/* =====================================================================
   PANNEAUX "CHAMP / VALEUR" (Config, Fondateur)
   ===================================================================== */
async function loadKeyValuePanel(entityKey){
  const entity = KEYVALUE_ENTITIES[entityKey];
  const panel = document.getElementById("panel-" + entityKey);
  panel.innerHTML = `<p class="loading">Chargement...</p>`;
  try{
    const rows = await apiGetRaw(entity.sheet);
    const current = {};
    rows.forEach(r=> current[r.champ] = r.valeur);

    panel.innerHTML = `<div id="kv-${entityKey}"></div><button class="btn btn-primary" id="kvSave-${entityKey}" style="margin-top:14px;width:100%">Enregistrer les modifications</button><div id="kvMsg-${entityKey}"></div>`;
    const wrap = document.getElementById(`kv-${entityKey}`);

    entity.fields.forEach(f=>{
      const value = current[f.key] !== undefined ? current[f.key] : "";
      const div = document.createElement("div");
      div.className = "field";
      if(f.type === "image"){
        div.innerHTML = `
          <label>${f.label}</label>
          ${value ? `<img src="${value}" class="img-preview" id="kvpreview-${entityKey}-${f.key}">` : ""}
          <input type="file" accept="image/*" id="kvfile-${entityKey}-${f.key}">
          <input type="hidden" id="kvfield-${entityKey}-${f.key}" value="${escapeAttr(String(value))}">
          <p style="font-size:11px;color:var(--muted);margin-top:4px" id="kvstatus-${entityKey}-${f.key}"></p>`;
      }else if(f.type === "textarea"){
        div.innerHTML = `<label>${f.label}</label><textarea id="kvfield-${entityKey}-${f.key}">${escapeHtml(String(value))}</textarea>`;
      }else if(f.type === "color"){
        div.innerHTML = `<label>${f.label}</label><input type="color" id="kvfield-${entityKey}-${f.key}" value="${value || '#25D366'}">`;
      }else{
        div.innerHTML = `<label>${f.label}</label><input type="${f.type==='number'?'number':'text'}" id="kvfield-${entityKey}-${f.key}" value="${escapeAttr(String(value))}">`;
      }
      wrap.appendChild(div);
      if(f.type === "image"){
        document.getElementById(`kvfile-${entityKey}-${f.key}`).addEventListener("change", async (e)=>{
          const file = e.target.files[0];
          if(!file) return;
          const status = document.getElementById(`kvstatus-${entityKey}-${f.key}`);
          status.textContent = "Téléversement en cours...";
          const reader = new FileReader();
          reader.onload = async ()=>{
            const base64 = reader.result.split(",")[1];
            const res = await apiPost({ action:"uploadImage", base64, filename:file.name, mimeType:file.type });
            if(res.ok){
              document.getElementById(`kvfield-${entityKey}-${f.key}`).value = res.url;
              status.textContent = "✅ Image téléversée";
            }else{
              status.textContent = "❌ Échec";
            }
          };
          reader.readAsDataURL(file);
        });
      }
    });

    document.getElementById(`kvSave-${entityKey}`).addEventListener("click", async ()=>{
      const msg = document.getElementById(`kvMsg-${entityKey}`);
      msg.innerHTML = `<div class="msg ok">Enregistrement...</div>`;
      try{
        for(const f of entity.fields){
          const el = document.getElementById(`kvfield-${entityKey}-${f.key}`);
          await apiPost({ action:"saveKeyValue", sheet:entity.sheet, champ:f.key, valeur: el.value });
        }
        msg.innerHTML = `<div class="msg ok">✅ Enregistré</div>`;
      }catch(err){
        msg.innerHTML = `<div class="msg err">Erreur réseau</div>`;
      }
    });
  }catch(err){
    panel.innerHTML = `<p class="loading">Erreur de chargement de l'onglet "${entity.sheet}".</p>`;
  }
}

/* =====================================================================
   LEADS (prospects lead magnets)
   ===================================================================== */
async function loadLeads(){
  const panel = document.getElementById("panel-leads");
  panel.innerHTML = `<p class="loading">Chargement...</p>`;
  try{
    const rows = await apiGetRaw("Leads");
    panel.innerHTML = `
      <div class="toolbar">
        <span style="color:var(--muted);font-size:12.5px">${rows.length} prospect(s)</span>
        <button class="btn btn-secondary btn-sm" id="exportLeads">Exporter CSV</button>
      </div>
      <div style="overflow-x:auto"><table><thead><tr><th>Prénom</th><th>WhatsApp</th><th>Livre</th><th>Date</th></tr></thead><tbody id="leadsBody"></tbody></table></div>`;
    const body = document.getElementById("leadsBody");
    rows.slice().reverse().forEach(r=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${escapeHtml(r.prenom||"")}</td><td>${escapeHtml(r.numero||"")}</td><td>${escapeHtml(r.livre||"")}</td><td>${escapeHtml(String(r.date||"")).slice(0,10)}</td>`;
      body.appendChild(tr);
    });
    document.getElementById("exportLeads").addEventListener("click", ()=> exportCsv(rows, ["prenom","numero","livre","date"], "leads.csv"));
  }catch(err){
    panel.innerHTML = `<p class="loading">Erreur de chargement.</p>`;
  }
}

/* =====================================================================
   COMMANDES
   ===================================================================== */
async function loadCommandes(){
  const panel = document.getElementById("panel-commandes");
  panel.innerHTML = `<p class="loading">Chargement...</p>`;
  try{
    const [rows, produits] = await Promise.all([apiGetRaw("Commandes"), apiGetRaw("Produits")]);
    panel.innerHTML = `
      <div class="toolbar">
        <span style="color:var(--muted);font-size:12.5px">${rows.length} commande(s)</span>
        <button class="btn btn-secondary btn-sm" id="exportCommandes">Exporter CSV</button>
      </div>
      <div class="list" id="commandesList"></div>`;
    const list = document.getElementById("commandesList");
    rows.slice().reverse().forEach(r=>{
      const produit = produits.find(p=> p.titre === r.produit);
      const lien = produit ? produit.lienTelechargement : "";
      const isPaye = String(r.statut).toLowerCase() === "payé" || String(r.statut).toLowerCase() === "paye";
      const el = document.createElement("div");
      el.className = "row-item";
      el.style.flexWrap = "wrap";
      el.innerHTML = `
        <div class="info">
          <div class="t">${escapeHtml(r.produit||"")} — ${escapeHtml(String(r.prix||""))} MAD</div>
          <div class="s">${escapeHtml(String(r.date||"")).slice(0,19)} · <span class="status-pill ${isPaye?'status-paye':'status-attente'}">${escapeHtml(r.statut||"en attente")}</span></div>
        </div>
        <div class="row-actions">
          ${lien ? `<button class="btn btn-secondary btn-sm" data-copy="${escapeAttr(lien)}">Copier le lien</button>` : ""}
          ${!isPaye ? `<button class="btn btn-primary btn-sm" data-paid>Marquer payé</button>` : ""}
        </div>`;
      const copyBtn = el.querySelector("[data-copy]");
      if(copyBtn) copyBtn.addEventListener("click", ()=>{
        navigator.clipboard.writeText(copyBtn.dataset.copy);
        copyBtn.textContent = "Copié !";
        setTimeout(()=> copyBtn.textContent = "Copier le lien", 1500);
      });
      const paidBtn = el.querySelector("[data-paid]");
      if(paidBtn) paidBtn.addEventListener("click", async ()=>{
        await apiPost({ action:"updateOrderStatus", row:r.__row, statut:"Payé" });
        loadCommandes();
      });
      list.appendChild(el);
    });
    document.getElementById("exportCommandes").addEventListener("click", ()=> exportCsv(rows, ["produit","prix","statut","date"], "commandes.csv"));
  }catch(err){
    panel.innerHTML = `<p class="loading">Erreur de chargement. Vérifiez que l'onglet "Commandes" existe.</p>`;
  }
}

/* =====================================================================
   UTILS
   ===================================================================== */
function exportCsv(rows, cols, filename){
  let csv = cols.join(",") + "\n";
  rows.forEach(r=>{ csv += cols.map(c=>`"${String(r[c]||"").replace(/"/g,'""')}"`).join(",") + "\n"; });
  const blob = new Blob([csv], { type:"text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function escapeHtml(str){ const d=document.createElement("div"); d.textContent = str==null?"":str; return d.innerHTML; }
function escapeAttr(str){ return String(str==null?"":str).replace(/"/g,"&quot;"); }
